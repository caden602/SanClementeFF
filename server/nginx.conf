limit_req_zone $binary_remote_addr zone=video_uploads:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=video_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name videos.2-24-124-55.sslip.io;

    client_max_body_size 750m;

    location /api/upload {
        limit_req zone=video_uploads burst=3 nodelay;
        limit_conn video_connections 2;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
    }

    location /media/ {
        alias /srv/sanclementeff/videos/;
        add_header Access-Control-Allow-Origin "https://sanclementeff.vercel.app" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { video/mp4 mp4; }
        sendfile on;
    }
}
